services:
  - type: web
    name: educator-app-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard  # Required for Docker-in-Docker
    dockerCommand: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DOCKER_HOST
        value: unix:///var/run/docker.sock
      # Environment variables will need to be set manually in Render dashboard:
      # DATABASE_URL, DB_USER, DB_PASSWORD, DB_HOST, DB_DATABASE, DB_PORT
      # JWT_SECRET, GEMINI_API_KEY, GLOT_API_KEY, etc.