# render.yaml
# Definitive, resilient multi-service architecture for Educator App

services:
  # The main Node.js Web API and WebSocket server
  - type: web
    name: educator-app-backend
    env: node
    plan: free # Or your chosen paid plan
    
    # Ensure this is your Dockerfile's location
    dockerfilePath: ./educators-edge-backend/Dockerfile
    
    # The command to start your Express server
    startCommand: "node educators-edge-backend/server.js"
    
    # Render uses this to know when your service is ready.
    # Ensure you have a simple GET /healthz route in server.js that returns 200 OK.
    healthCheckPath: /healthz
    
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: educator-redis # The name of the Redis service defined below
          property: connectionString
      - key: PORT # Let Render inject the port for the web service
        value: 10000
      # DATABASE_URL and other secrets (JWT_SECRET, GEMINI_API_KEY, etc.) 
      # should be added manually in the Render Environment tab
      # using your existing Neon database connection string

  # The background worker for code execution
  - type: worker
    name: educator-worker
    env: node
    plan: free # Or a paid plan if it needs more resources

    # It uses the same Dockerfile as the web service
    dockerfilePath: ./educators-edge-backend/Dockerfile
    
    # The command to start your BullMQ worker
    startCommand: "node educators-edge-backend/dockerWorker.js"
    
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: educator-redis
          property: connectionString
      # DATABASE_URL should be added manually in the Render Environment tab
      # using your existing Neon database connection string

  # Redis service for job queues
  - type: redis
    name: educator-redis
    plan: free