# render.yaml
# Definitive Free Tier Architecture: One service running two processes with pm2

services:
  # A single web service that runs both your API and Worker
  - type: web
    name: educator-app-backend
    env: docker
    plan: free
    
    # Health check for your Express server
    healthCheckPath: /healthz

    # Tell Render where the Dockerfile is
    dockerfilePath: ./Dockerfile
    
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: educator-redis
          property: connectionString
      - key: PORT
        value: 10000
      # DATABASE_URL and other secrets (JWT_SECRET, GEMINI_API_KEY, etc.) 
      # should be added manually in the Render Environment tab
      # using your existing Neon database connection string

  # Redis service for job queues
  - type: redis
    name: educator-redis
    plan: free
    ipAllowList: []