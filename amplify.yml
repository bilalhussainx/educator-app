version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd educators-edge-frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: educators-edge-frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - educators-edge-frontend/node_modules/**/*

# Environment variables will be set in Amplify Console
# VITE_API_URL
# VITE_WS_URL
# VITE_AGORA_APP_ID
# VITE_AZURE_DOCUMENT_INTELLIGENCE_KEY
# VITE_AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
