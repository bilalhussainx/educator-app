# GitHub Actions workflow for automatic backend deployment to AWS Elastic Beanstalk
# This is optional - only if you want CI/CD automation

name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches: [ main ]
    paths:
      - 'educators-edge-backend/**'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd educators-edge-backend
        npm ci --production

    - name: Create deployment package
      run: |
        cd educators-edge-backend
        zip -r ../deploy.zip . -x "*.git*" "node_modules/*" "*.log"

    - name: Deploy to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v21
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: CoreZenith-Backend
        environment_name: CoreZenith-Backend-prod
        version_label: ${{ github.sha }}
        region: us-east-1
        deployment_package: deploy.zip

# To use this workflow:
# 1. Go to GitHub repository → Settings → Secrets and variables → Actions
# 2. Add secrets:
#    - AWS_ACCESS_KEY_ID
#    - AWS_SECRET_ACCESS_KEY
# 3. Push to main branch - deployment will happen automatically!
